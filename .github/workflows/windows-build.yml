name: Windows build validation

on:
  push:
    branches:
      - master
      - 'codex/**'
      - 'beta/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run unit tests
        run: dotnet test tests/UnitTests/UnitTests.csproj -c Release
      # Setup.exe performs an administrative installation (service/registry changes) and cannot run
      # non-destructively in CI, so we validate SettingsMigration and WindowAgentSmoke instead.
      - name: Test settings migration
        run: dotnet run --project tests/SettingsMigration/SettingsMigration.csproj -c Release
      - name: Build and run WindowAgent smoke test
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $outDir = Join-Path $env:RUNNER_TEMP 'window-agent-smoke'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $exe = Join-Path $outDir 'WindowAgentSmoke.exe'
          & $csc /nologo /target:exe /main:WindowAgentSmoke /out:$exe /r:System.Windows.Forms.dll src/WindowAgent/Program.cs tests/WindowAgentSmoke/Program.cs
          if ($LASTEXITCODE -ne 0) { throw 'WindowAgentSmoke build failed.' }
          & $exe
          if ($LASTEXITCODE -ne 0) { throw 'WindowAgentSmoke execution failed.' }
      - name: Build application and installer
        shell: pwsh
        run: ./build_distribution.ps1
      - name: Validate release package contents
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/installer/Setup.exe')) { throw 'Setup.exe was not produced.' }
          if (!(Test-Path 'dist/WindowsAppProtector.zip')) { throw 'WindowsAppProtector.zip was not produced.' }
          $setupHash = (Get-FileHash 'dist/installer/Setup.exe' -Algorithm SHA256).Hash
          $zipHash = (Get-FileHash 'dist/WindowsAppProtector.zip' -Algorithm SHA256).Hash
          "Setup.exe SHA256: $setupHash"
          "WindowsAppProtector.zip SHA256: $zipHash"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app-protector-build
          path: |
            dist/installer/Setup.exe
            dist/WindowsAppProtector.zip
          if-no-files-found: error
